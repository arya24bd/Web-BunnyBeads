<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true">
  <!-- TikTok black circle with music note -->
  <circle cx="100" cy="100" r="95" fill="#000"/>
  <g transform="translate(70, 50) scale(1.3)">
    <!-- cyan arc (left) -->
    <path d="M 15 5 Q 15 25 30 40" stroke="#25F4EA" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- magenta/pink arc (right) -->
    <path d="M 35 15 Q 40 20 40 40 L 40 55 Q 40 65 30 70" stroke="#FF2D55" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bottom curve -->
    <path d="M 30 40 Q 25 50 15 50" stroke="#FF2D55" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

