<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true">
  <!-- Shopee bag orange with S -->
  <g transform="translate(30, 30) scale(1.1)">
    <!-- handle -->
    <path d="M 35 10 Q 60 10 60 35" stroke="#EE4D2D" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bag body -->
    <rect x="20" y="35" width="80" height="75" rx="12" fill="#EE4D2D" stroke="#EE4D2D" stroke-width="2"/>
    <!-- S letter white -->
    <path d="M 45 55 Q 45 48 55 48 Q 62 48 62 55 Q 62 60 55 62 Q 48 62 48 68 Q 48 75 55 75 Q 62 75 62 70" 
          stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

