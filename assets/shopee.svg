<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true">
  <!-- Shopee bag orange with S -->
<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shopee logo SVG wrapper that embeds the provided raster image.
  Replace the placeholder text `REPLACE_WITH_BASE64_IMAGE` with the
  base64 data of your PNG (without extra whitespace) so the <image>
  element renders the actual logo. Example value starts with
  `iVBORw0KGgo...` for PNG files.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet">
  <title>Shopee (embedded raster)</title>
  <image x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"
         href="data:image/png;base64,REPLACE_WITH_BASE64_IMAGE" />
</svg>
</svg>

